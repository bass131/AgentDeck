<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDeck 코드 지도</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec; --hover: #e9e8e3;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #75736e; --line: #e1e0d9; --axis: #c3c2b7;
  --accent: #2a78d6; --sel: rgba(42,120,214,.14); --hit: rgba(237,161,0,.28); --tour: rgba(232,123,164,.22);
  --k-class: #2a78d6; --k-interface: #1baf7a; --k-type: #6250d6; --k-function: #eb6834;
  --k-component: #e87ba4; --k-const: #eda100; --k-field: #008300; --k-hook: #e34948;
  --k-process: #0b0b0b; --k-domain: #52514e; --k-folder: #898781; --k-file: #a8a69f;
  --seq-0: #f0efec; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;
  --p-renderer: #2a78d6; --p-preload: #6250d6; --p-main: #eb6834; --p-shared: #1baf7a;
  /* 코드 구문 색 */
  --c-kw: #a626a4; --c-str: #2f7d32; --c-num: #b45309; --c-com: #8a8880; --c-type: #1f6fb2; --c-fn: #b4451f; --c-tag: #c0306b; --c-re: #0f7c7c;
  --code-bg: #fcfcfb; --code-hl: rgba(237,161,0,.20); --code-hl-soft: rgba(237,161,0,.06); --code-hl-bar: #eda100; --ln: #a8a69f;
  --mono: Consolas, "D2Coding", "Cascadia Mono", ui-monospace, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --hover: #2c2c2a;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8d86; --line: #2c2c2a; --axis: #383835;
    --accent: #3987e5; --sel: rgba(57,135,229,.22); --hit: rgba(201,133,0,.35); --tour: rgba(213,81,129,.30);
    --k-class: #3987e5; --k-interface: #199e70; --k-type: #9085e9; --k-function: #d95926;
    --k-component: #d55181; --k-const: #c98500; --k-field: #0ca30c; --k-hook: #e66767;
    --k-process: #f0efec; --k-domain: #c3c2b7; --k-folder: #898781; --k-file: #5e5d59;
    --seq-0: #242422; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #2a78d6; --seq-6: #3987e5;
    --p-renderer: #3987e5; --p-preload: #9085e9; --p-main: #d95926; --p-shared: #199e70;
    --c-kw: #d48fe0; --c-str: #8fcf87; --c-num: #f0a35a; --c-com: #7d7b74; --c-type: #7fb6f0; --c-fn: #f2a07b; --c-tag: #f08bb3; --c-re: #6fd0d0;
    --code-bg: #141413; --code-hl: rgba(201,133,0,.22); --code-hl-soft: rgba(201,133,0,.07); --code-hl-bar: #c98500; --ln: #5e5d59;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --hover: #2c2c2a;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8d86; --line: #2c2c2a; --axis: #383835;
  --accent: #3987e5; --sel: rgba(57,135,229,.22); --hit: rgba(201,133,0,.35); --tour: rgba(213,81,129,.30);
  --k-class: #3987e5; --k-interface: #199e70; --k-type: #9085e9; --k-function: #d95926;
  --k-component: #d55181; --k-const: #c98500; --k-field: #0ca30c; --k-hook: #e66767;
  --k-process: #f0efec; --k-domain: #c3c2b7; --k-folder: #898781; --k-file: #5e5d59;
  --seq-0: #242422; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #2a78d6; --seq-6: #3987e5;
  --p-renderer: #3987e5; --p-preload: #9085e9; --p-main: #d95926; --p-shared: #199e70;
  --c-kw: #d48fe0; --c-str: #8fcf87; --c-num: #f0a35a; --c-com: #7d7b74; --c-type: #7fb6f0; --c-fn: #f2a07b; --c-tag: #f08bb3; --c-re: #6fd0d0;
  --code-bg: #141413; --code-hl: rgba(201,133,0,.22); --code-hl-soft: rgba(201,133,0,.07); --code-hl-bar: #c98500; --ln: #5e5d59;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 13px/1.5 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
button, select { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button:hover { background: var(--hover); }
button.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
code, .mono { font-family: var(--mono); font-size: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; font-weight: 650; white-space: nowrap; }
header h1 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.tabs, .levels { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.levels span { color: var(--muted); margin-right: 2px; }
.search { position: relative; flex: 1 1 180px; max-width: 320px; min-width: 0; }
.search input { width: 100%; font: inherit; color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
.search ul { position: absolute; z-index: 20; top: 100%; right: 0; width: min(600px, calc(100vw - 32px)); margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 60vh; overflow: auto; display: none; }
.search li { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 5px; cursor: pointer; min-width: 0; }
.search li:hover, .search li.act { background: var(--hover); }
.search li > span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search li .p { color: var(--muted); font-size: 11px; margin-left: auto; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
.bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 5px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.crumbs { padding: 5px 16px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; min-height: 29px; }
.crumbs b { color: var(--muted); font-weight: 500; margin-right: 4px; }
.crumbs a { color: var(--ink-2); cursor: pointer; padding: 1px 4px; border-radius: 4px; text-decoration: none; overflow-wrap: anywhere; }
.crumbs a:hover { background: var(--hover); color: var(--ink); }
.crumbs a:last-child { color: var(--ink); font-weight: 600; }
.crumbs i { color: var(--axis); font-style: normal; }
#tourbar { display: none; gap: 8px 12px; align-items: center; flex-wrap: wrap; padding: 6px 16px; background: var(--tour); border-bottom: 1px solid var(--line); }
#tourbar b { white-space: nowrap; }
#tourbar .txt { flex: 1 1 300px; min-width: 0; color: var(--ink-2); }
.panetabs { display: none; gap: 4px; padding: 5px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.panetabs button { flex: 1 1 0; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
body.lay-3.v-tree main { grid-template-columns: minmax(0, 1.1fr) minmax(280px, .72fr) minmax(0, 1fr); }
body.lay-2.v-tree main { grid-template-columns: minmax(0, 1fr) minmax(300px, .85fr); }
main > * { min-width: 0; min-height: 0; }
#treeWrap { overflow: auto; position: relative; background: var(--surface); }
#treeSvg { display: block; }
#treeSvg .lk { fill: none; stroke: var(--axis); stroke-width: 1.2; }
#treeSvg g.n { cursor: pointer; }
#treeSvg g.n text.lb { fill: var(--ink); font: 13px var(--sans); dominant-baseline: central; }
#treeSvg g.n text.lb.exp { font-weight: 650; }
#treeSvg g.n text.sub { fill: var(--muted); font: 11.5px var(--mono); dominant-baseline: central; }
#treeSvg g.n text.desc { fill: var(--ink-2); font: 11.5px var(--sans); dominant-baseline: central; }
#treeSvg g.n text.ic { fill: #fff; font: 700 10px var(--sans); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#treeSvg g.n text.ic.dk { fill: #0b0b0b; }
#treeSvg g.n rect.bg { fill: transparent; }
#treeSvg g.n:hover rect.bg { fill: var(--hover); }
#treeSvg g.n.hit rect.bg { fill: var(--hit); }
#treeSvg g.n.tourn rect.bg { fill: var(--tour); }
#treeSvg g.n.sel rect.bg { fill: var(--sel); stroke: var(--accent); stroke-width: 1; }
#treeSvg g.n circle.kn { stroke: var(--surface); stroke-width: 2; }
#treeSvg g.n circle.ring { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 2 2; }
#treeSvg g.n text.lb.grp { fill: var(--ink-2); font: 600 12px var(--sans); }
#treeSvg g.n rect.pill { fill: var(--surface-2); stroke: var(--line); }
#treeSvg g.n rect.pill.vx { fill: var(--sel); stroke: var(--accent); }
#treeSvg g.n rect.pill.vi { fill: transparent; stroke: var(--axis); stroke-dasharray: 3 2; }
#treeSvg g.n rect.pill.vr { fill: transparent; stroke: var(--k-function); }
#treeSvg g.n text.kl.vx { fill: var(--accent); font-weight: 600; }
#treeSvg g.n rect.band { opacity: .85; }
#treeSvg g.n text.kl { fill: var(--ink-2); font: 10.5px var(--sans); text-anchor: middle; dominant-baseline: central; }
#treeSvg g.n text.more { fill: var(--accent); font: 600 11px var(--sans); dominant-baseline: central; }
#treeSvg g.n text.stop { fill: var(--k-component); font: 700 11px var(--sans); dominant-baseline: central; }
aside#detail { overflow: auto; border-left: 1px solid var(--line); background: var(--page); padding: 14px 16px 40px; }
aside h2 { font-size: 16px; margin: 0 0 2px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; }
aside h3, .h3 { font-size: 12px; margin: 18px 0 6px; color: var(--ink-2); }
aside .kindline { color: var(--muted); margin-bottom: 8px; overflow-wrap: anywhere; }
.descbox { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--k-component); border-radius: 4px; padding: 7px 10px; margin: 8px 0; color: var(--ink); }
.descbox b { color: var(--muted); font-weight: 500; font-size: 11.5px; display: block; }
aside .doc { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; padding: 6px 10px; margin: 8px 0; color: var(--ink-2); overflow-wrap: anywhere; }
aside .sig { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: auto; }
table.t th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 3px 6px; white-space: nowrap; }
table.t td { border-bottom: 1px solid var(--line); padding: 3px 6px; vertical-align: top; overflow-wrap: anywhere; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t td.ac { font-size: 11px; overflow-wrap: normal; }
table.t td.kd { word-break: keep-all; overflow-wrap: normal; }
table.t td.nm { overflow-wrap: break-word; word-break: normal; }
table.t td.nm .ty { color: var(--ink-2); overflow-wrap: anywhere; margin-top: 1px; }
table.t td.nm .ty code { font-size: 11.5px; }
table.t tr.jump { cursor: pointer; }
table.t tr.gh td { background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 11.5px; padding: 3px 6px; border-bottom: 1px solid var(--line); }
table.t tr.jump:hover td { background: var(--hover); }
.area { display: inline-block; font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 9px; color: #fff; font-weight: 650; white-space: nowrap; vertical-align: 1px; }
.vis { display: inline-block; font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 9px; white-space: nowrap; border: 1px solid var(--line); }
.vis.vx { background: var(--sel); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.vis.vi { border-style: dashed; border-color: var(--axis); color: var(--ink-2); }
.vis.vr { border-color: var(--k-function); color: var(--ink); }
.owner { margin: 6px 0; padding: 6px 10px; border-left: 4px solid var(--line); background: var(--surface); border-radius: 0 4px 4px 0; overflow-wrap: anywhere; }
.owner b { color: var(--muted); font-weight: 500; margin-right: 6px; }
.metarow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 6px; }
.usedgrp { margin: 8px 0 2px; display: flex; gap: 6px; align-items: center; }
aside#detail { border-top: 4px solid var(--area, transparent); }
#codePane { border-top: 4px solid var(--area, transparent); }
.crumbs { border-left: 5px solid var(--area, transparent); }
.tag { display: inline-block; font-size: 10.5px; line-height: 16px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); margin: 0 3px 2px 0; white-space: nowrap; }
.tag.k { color: #fff; border: none; }
.tag.k.dk { color: #0b0b0b; }
.acc { font-family: var(--mono); font-weight: 700; width: 14px; display: inline-block; text-align: center; }
.acc.pri { color: var(--k-hook); } .acc.pro { color: var(--k-const); } .acc.pub { color: var(--k-field); }
.jl { color: var(--accent); cursor: pointer; text-decoration: none; overflow-wrap: anywhere; }
.jl:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
details.legend { border-top: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--ink-2); }
details.legend summary { padding: 4px 16px; cursor: pointer; color: var(--muted); }
details.legend .in { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 0 16px 6px; }
.legend .it { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font: 700 9.5px var(--sans); flex: none; }
.dot.dk { color: #0b0b0b; }
/* 코드 보기 */
#codePane { display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--code-bg); }
.codehead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.codehead .path { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; flex: 1 1 200px; min-width: 0; }
.codebody { flex: 1; overflow: auto; min-height: 0; position: relative; }
.codebody.wrap .tx { white-space: pre-wrap; overflow-wrap: anywhere; }
.code { font: 12.5px/1.55 var(--mono); margin: 0; padding: 6px 0 40px; min-width: max-content; }
.codebody.wrap .code { min-width: 0; }
.code .ln { display: flex; }
.code .no { flex: none; width: 4.2em; padding-right: 12px; text-align: right; color: var(--ln); user-select: none; }
.code .tx { white-space: pre; padding-right: 16px; }
.code .ln.hl { background: var(--code-hl); box-shadow: inset 3px 0 0 var(--code-hl-bar); }
.code.long .ln.hl { background: var(--code-hl-soft); }
.code.long .ln.hl.h0 { background: var(--code-hl); }
.code .ln.hl .no { color: var(--ink-2); }
.t-k { color: var(--c-kw); } .t-s { color: var(--c-str); } .t-n { color: var(--c-num); } .t-c { color: var(--c-com); font-style: italic; }
.t-t { color: var(--c-type); } .t-f { color: var(--c-fn); } .t-g { color: var(--c-tag); } .t-r { color: var(--c-re); }
a.imp { color: var(--c-str); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
a.imp:hover { text-decoration-style: solid; }
.empty { color: var(--muted); padding: 24px 16px; }
.snip { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 8px 0; background: var(--code-bg); }
.snip-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: space-between; padding: 4px 10px; background: var(--surface-2); font-size: 11.5px; color: var(--ink-2); }
.snip-h code { overflow-wrap: anywhere; }
.snip .code { padding: 6px 0 8px; min-width: max-content; }
.snip .scroll { overflow: auto; max-height: 360px; }
/* 페이지 보기 */
#pageView { overflow: auto; padding: 18px clamp(12px, 2.5vw, 28px) 60px; display: none; background: var(--page); }
#pageView h2 { font-size: 18px; margin: 4px 0 4px; }
#pageView .lead { color: var(--ink-2); margin: 0 0 16px; max-width: 900px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card h3 { font-size: 13.5px; margin: 0 0 4px; }
.card .why { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.card.wide { grid-column: 1 / -1; }
.bars { display: grid; grid-template-columns: minmax(0, max-content) minmax(40px, 1fr) max-content; gap: 4px 10px; align-items: center; }
.bars .lb { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .tr { height: 12px; background: var(--surface-2); border-radius: 3px; position: relative; }
.bars .fl { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.bars .v { font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
.bars .v small { color: var(--muted); margin-left: 4px; }
.mat { border-collapse: separate; border-spacing: 2px; font-size: clamp(10px, 1.6vw, 12px); }
.mat th { font-weight: 500; color: var(--ink-2); padding: 2px 4px; white-space: nowrap; }
.mat th.col { writing-mode: vertical-rl; text-orientation: sideways; transform: rotate(180deg); text-align: left; vertical-align: bottom; padding: 4px 2px; height: 10em; }
.mat th.row { text-align: right; }
.mat td { width: clamp(20px, 3.4vw, 40px); height: clamp(22px, 3vw, 28px); text-align: center; border-radius: 4px; font-variant-numeric: tabular-nums; cursor: pointer; padding: 0; }
.mat td.self { background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 3px, transparent 3px, transparent 6px); cursor: default; }
.mat td.on { outline: 2px solid var(--ink); }
.mat td.sep { width: 6px; background: none; cursor: default; }
.scaleleg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; margin: 8px 0; }
.scaleleg i { width: 22px; height: 12px; border-radius: 3px; display: inline-block; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--page); padding: 5px 8px; border-radius: 6px; font-size: 12px; max-width: 360px; display: none; }
.note { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
.list { max-height: 280px; overflow: auto; }
/* 투어 */
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 18px; }
.flow .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 3px 10px 3px 4px; cursor: pointer; }
.flow .chip:hover { background: var(--hover); }
.flow .chip .num { width: 20px; height: 20px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; }
.flow .arr { color: var(--muted); }
.lanes { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.lanes i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.stop { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 12px; margin-bottom: 22px; }
.stop .num { width: 30px; height: 30px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }

// ───────── 검색 ─────────
let qItems = [], qAct = 0;
function doSearch(q) {
  const ul = $('#qres');
  hits = new Set();
  q = q.trim().toLowerCase();
  if (!q) { ul.style.display = 'none'; render(); return; }
  const scored = [];
  for (const n of allNodes) {
    if (n.kind === 'root') continue;
    const nm = n.name.toLowerCase();
    let s = -1;
    if (nm === q) s = 0; else if (nm.startsWith(q)) s = 1; else if (nm.includes(q)) s = 2; else if (n.kind === 'file' && n.path.toLowerCase().includes(q)) s = 3;
    if (s >= 0) { scored.push([s, depthOf.get(n), n]); hits.add(n); }
  }
  scored.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2].name.localeCompare(b[2].name));
  qItems = scored.slice(0, 60).map((x) => x[2]);
  qAct = 0;
  ul.innerHTML = (qItems.length ? qItems.map((n, i) => `<li data-i="${i}" class="${i === 0 ? 'act' : ''}"><span class="dot${isDarkIcon(n) ? ' dk' : ''}" style="background:${colorVar(n)}">${esc(look(n).ic)}</span><span>${esc(n.name)}</span><span class="p">${areaBadge(n._proc)} ${esc(shortOf(n) || koOf(n))} · ${esc(fileOf.get(n)?.path ?? n.path ?? '')}</span></li>`).join('') : '<li class="muted">결과 없음</li>')
    + (scored.length > 60 ? `<li class="muted">… 외 ${scored.length - 60}개 (트리에서 노란 배경)</li>` : '');
  ul.style.display = 'block';
  render();
}
function pickSearch(i) {
  const n = qItems[i];

  $('#qres').style.display = 'none';
  if (view !== 'tree') setView('tree');

}

// ───────── 도메인 의존 보기 ─────────
let depProc = 'renderer', depMode = 'all', depCell = null;
const procOf = (dk) => dk.split('/')[0];
const domOf = (dk) => dk.split('/').slice(1).join('/');
function seqColor(v, max) {
  if (!v) return 'var(--seq-0)';
  const t = Math.log(1 + v) / Math.log(1 + max);
  return `var(--seq-${Math.min(6, 1 + Math.floor(t * 5.999))})`;
}
function edgesBetween(fromDk, toDk) {
  const out = [];
  for (const [p, f] of Object.entries(DATA.files)) {
    if (`${f.proc}/${f.domain}` !== fromDk) continue;
    for (const im of f.imports) {
      const t = DATA.files[im.path];
      const tk = toDk.endsWith('/*') ? t.proc + '/*' : `${t.proc}/${t.domain}`;
      if (tk === toDk && (depMode === 'all' || !im.typeOnly)) out.push([p, im]);
    }
  }
  return out;
}
function procSummary() {
  const parts = [];
  for (const [from, m] of Object.entries(DATA.procMatrix)) for (const [to, v] of Object.entries(m)) parts.push(`${from} → ${to} ${v}건`);
  return '행이 열을 import한 파일→파일 연결 수. ' + (parts.length ? parts.join(', ') + '. 이 밖의 프로세스 쌍 사이에는 import가 없다.' : 'import 없음.');
}
function renderDeps() {
  const pv = $('#pageView');
  const M = depMode === 'all' ? DATA.depMatrix : DATA.depMatrixRuntime;
  const doms = DATA.domains.filter((k) => procOf(k) === depProc);
  const others = PROCS.filter((p) => p !== depProc);
  const otherTotals = {};
  for (const r of doms) for (const p of others) otherTotals[r + '>' + p] = Object.entries(M[r] ?? {}).filter(([k]) => procOf(k) === p).reduce((s, [, v]) => s + v, 0);
  const usedOthers = others.filter((p) => doms.some((r) => otherTotals[r + '>' + p]));
  let max = 1;
  for (const r of doms) for (const c of doms) max = Math.max(max, M[r]?.[c] ?? 0);
  for (const v of Object.values(otherTotals)) max = Math.max(max, v);
  const dark = themeIsDark();
  const cell = (r, c, v) => {
    const on = depCell && depCell[0] === r && depCell[1] === c;
    const t = v ? Math.log(1 + v) / Math.log(1 + max) : 0;
    const ink = v && (t > 0.55 || dark) ? '#fff' : 'var(--ink)';
    return `<td class="${on ? 'on' : ''}" data-r="${esc(r)}" data-c="${esc(c)}" data-v="${v}" style="background:${seqColor(v, max)};color:${ink}">${v || ''}</td>`;
  };
  const head = `<tr><th></th>${doms.map((c) => `<th class="col">${esc(domOf(c))}</th>`).join('')}${usedOthers.length ? '<td class="sep"></td>' : ''}${usedOthers.map((p) => `<th class="col">→ ${esc(p)} 전체</th>`).join('')}<th class="col">합계(밖으로)</th></tr>`;
  const rows = doms.map((r) => {
    const tot = Object.values(M[r] ?? {}).reduce((s, v) => s + v, 0);
    return `<tr><th class="row">${esc(domOf(r))}</th>${doms.map((c) => (r === c ? '<td class="self" title="같은 도메인 안은 세지 않는다"></td>' : cell(r, c, M[r]?.[c] ?? 0))).join('')}${usedOthers.length ? '<td class="sep"></td>' : ''}${usedOthers.map((p) => cell(r, p + '/*', otherTotals[r + '>' + p])).join('')}<td style="cursor:default;color:var(--ink-2)">${tot || ''}</td></tr>`;
  }).join('');
  const colTot = `<tr><th class="row">합계(안으로)</th>${doms.map((c) => `<td style="cursor:default;color:var(--ink-2)">${Object.values(M).reduce((s, m) => s + (m[c] ?? 0), 0) || ''}</td>`).join('')}</tr>`;
  const P = DATA.procMatrix;
  const pmax = Math.max(1, ...PROCS.flatMap((r) => PROCS.map((c) => P[r]?.[c] ?? 0)));
  const ptable = `<table class="mat"><tr><th></th>${PROCS.map((c) => `<th>${c}</th>`).join('')}</tr>${PROCS.map((r) => `<tr><th class="row">${r}</th>${PROCS.map((c) => (r === c ? '<td class="self"></td>' : `<td style="background:${seqColor(P[r]?.[c] ?? 0, pmax)};color:${(P[r]?.[c] ?? 0) / pmax > 0.4 || dark ? '#fff' : 'var(--ink)'};cursor:default">${P[r]?.[c] || ''}</td>`)).join('')}</tr>`).join('')}</table>`;
  let edgeHtml = '<p class="muted">칸을 누르면 그 두 도메인 사이의 실제 import 목록이 여기 나온다.</p>';
  if (depCell) {
    const es = edgesBetween(depCell[0], depCell[1]);
    edgeHtml = `<h3>${esc(depCell[0])} → ${esc(depCell[1].replace('/*', ' 전체'))} (${es.length})</h3><table class="t"><thead><tr><th>import하는 파일</th><th>대상 파일</th><th>가져오는 이름</th></tr></thead><tbody>${es.map(([p, im]) => `<tr><td>${jump(byPath.get(p), p)}</td><td>${jump(byPath.get(im.path), im.path)}${im.typeOnly ? ' <span class="tag">type만</span>' : ''}</td><td class="mono muted">${esc(short(im.names.join(', '), 90))}</td></tr>`).join('')}</tbody></table>`;
  }
  const desc = (k) => nodes.get(DATA.tree.children.find((p) => p.name === procOf(k))?.key)?.desc;
  pv.innerHTML = `<h2>도메인 의존 — 누가 누구를 import하는가</h2>
  <p class="lead">행 도메인이 열 도메인을 import한 수다. 단위는 「파일→파일 import 연결」이다(한 파일이 같은 대상 파일에서 여러 이름을 가져와도 1). 같은 도메인 안은 세지 않는다. 색이 진할수록 많다(로그 눈금).</p>
  <div class="tabs" style="margin-bottom:8px">${PROCS.map((p) => `<button data-dproc="${p}" class="${p === depProc ? 'on' : ''}">${p}</button>`).join('')}<span style="width:12px"></span><button data-dmode="all" class="${depMode === 'all' ? 'on' : ''}">import type 포함</button><button data-dmode="runtime" class="${depMode === 'runtime' ? 'on' : ''}">값 import만</button></div>
  <p class="why" style="color:var(--ink-2)">${esc(desc(depProc + '/x') ?? '')}</p>
  <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), max-content))">
    <div class="card"><h3>${esc(depProc)} 프로세스 안 도메인 의존</h3><p class="why">오른쪽 「→ 다른 프로세스 전체」 열은 그 프로세스로 나가는 import를 합친 것이다.</p>
      <table class="mat" id="mat">${head}${rows}${colTot}</table>
      <div class="scaleleg">적음 ${[1, 2, 3, 4, 5, 6].map((i) => `<i style="background:var(--seq-${i})"></i>`).join('')} 많음 · 최대 ${max}</div></div>
    <div class="card" style="max-width:640px"><h3>프로세스 사이 (파일→파일)</h3><p class="why">${procSummary()}</p>${ptable}<div style="margin-top:12px">${edgeHtml}</div></div>
  </div>`;
}

// ───────── 배치 (적응형) ─────────
function computeLay() {
  const w = window.innerWidth;
  return w >= 1500 ? 3 : w >= 900 ? 2 : 1;
}
function applyLayout() {
  const b = document.body;
  b.classList.remove('lay-1', 'lay-2', 'lay-3', 'v-tree', 'v-page');
  b.classList.add('lay-' + lay, view === 'tree' ? 'v-tree' : 'v-page');
  const isTree = view === 'tree';
  const show = (el, on) => { el.style.display = on ? '' : 'none'; };
  show($('#pageView'), !isTree);
  show($('#treebar'), isTree);
  show($('#crumbs'), isTree);
  $('#pageView').style.display = isTree ? 'none' : 'block';
  const panetabs = $('#panetabs');
  panetabs.style.display = isTree && lay < 3 ? 'flex' : 'none';
  if (lay === 3) { show($('#treeWrap'), isTree); show($('#detail'), isTree); show($('#codePane'), isTree); }
  else if (lay === 2) { show($('#treeWrap'), isTree); show($('#detail'), isTree && side === 'detail'); show($('#codePane'), isTree && side === 'code'); }
  else { show($('#treeWrap'), isTree && pane === 'tree'); show($('#detail'), isTree && pane === 'detail'); show($('#codePane'), isTree && pane === 'code'); }
  const active = lay === 2 ? side : pane;
  panetabs.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.pane === active));
  $('#legend').open = window.innerWidth >= 900 && isTree;
  renderTourBar();
}

// ───────── 보기 전환 ─────────
function setView(v) {
  view = v;
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
  applyLayout();
  if (v === 'tree') {
    render();
    if (selected) scrollToNode(selected);
    if (codeVisible() && codeStale()) showCodeFor(selected);
  } else {
    $('#pageView').scrollTop = 0;
    if (v === 'conv') renderConv();
    else if (v === 'deps') renderDeps();
    else if (v === 'tour') renderTour();
  }
  writeHash();
}

// ───────── URL 해시 ─────────
function writeHash() {
  const p = new URLSearchParams();
  if (view !== 'tree') p.set('view', view);
  if (selected) p.set('sel', selected.key);
  if (tourIdx >= 0) p.set('tour', String(tourIdx + 1));
  if (shape !== 'auto') p.set('shape', shape);
  if (order !== 'kind') p.set('order', order);
  if (lay === 1 && pane !== 'tree') p.set('pane', pane);
  if (lay === 2 && side !== 'detail') p.set('pane', side);
  if (document.documentElement.dataset.theme) p.set('theme', document.documentElement.dataset.theme);
  if (view === 'deps') { p.set('proc', depProc); if (depMode !== 'all') p.set('mode', depMode); }
  history.replaceState(null, '', '#' + p.toString());
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const th = p.get('theme');
  if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  if (p.get('proc')) depProc = p.get('proc');
  if (p.get('mode')) depMode = p.get('mode');
  if (['auto', 'graph', 'list'].includes(p.get('shape'))) shape = p.get('shape');
  if (p.get('order') === 'source') order = 'source';
  document.querySelectorAll('[data-order]').forEach((b) => b.classList.toggle('on', b.dataset.order === order));
  const pn = p.get('pane');
  if (pn === 'detail' || pn === 'code' || pn === 'tree') { pane = pn; if (pn !== 'tree') side = pn; }
  lay = computeLay();
  const lv = +p.get('level');
  if (lv) applyLevel(lv);
  renderLegend();
  const tour = +p.get('tour');
  if (tour) { applyLayout(); startTour(tour - 1); if (p.get('view')) setView(p.get('view')); return; }
  const sel = p.get('sel') && nodes.get(p.get('sel'));
  view = p.get('view') ?? 'tree';
  if (sel) { selected = sel; openTo(sel); if (sel.children?.length) open.add(sel.key); }
  renderDetail(sel ?? null);
  setView(view);
  if (sel && view === 'tree') requestAnimationFrame(() => scrollToNode(sel, true));
  if (p.get('q')) { $('#q').value = p.get('q'); doSearch(p.get('q')); }
}

// ───────── 이벤트 ─────────
$('#treeSvg').addEventListener('click', (e) => {
  const g = e.target.closest('g.n');
  if (!g) return;
  const n = nodeOfKey(g.dataset.k);
  if (n.kind === 'group') { if (closedGroups.has(n.key)) closedGroups.delete(n.key); else closedGroups.add(n.key); render(); return; }
  if (e.target.dataset.t) {
    if (open.has(n.key)) open.delete(n.key); else if (n.children?.length) open.add(n.key);
    render();
    return;
  }
  select(n, { reveal: false, expand: true });
});
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('svg')) return;

  const gv = t.closest('[data-goview]'); if (gv) { setView(gv.dataset.goview); return; }
  const lb = t.closest('[data-level]'); if (lb) { setLevel(+lb.dataset.level); return; }

  if (pb) {
    if (lay === 2) side = pb.dataset.pane; else pane = pb.dataset.pane;
    applyLayout();
    if (pb.dataset.pane === 'tree') render();
    if (pb.dataset.pane === 'code' && codeStale()) showCodeFor(selected);

  }
  const ts = t.closest('[data-tourstep]'); if (ts) { startTour(tourIdx + +ts.dataset.tourstep); return; }
  const tr = t.closest('[data-tour]'); if (tr) { startTour(+tr.dataset.tour); return; }
  const imp = t.closest('a.imp');
  if (imp) { const n = byPath.get(imp.dataset.path); if (n) { select(n, { expand: false, code: false }); openCode(n.path, null, null); } return; }
  const cd = t.closest('[data-code]'); if (cd) { openCodeAt(cd.dataset.code, +cd.dataset.from, +cd.dataset.to); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'tourClose') stopTour();
    else if (a === 'codeWrap') { codeWrap = !codeWrap; $('#codeBody').classList.toggle('wrap', codeWrap); act.classList.toggle('on', codeWrap); }
    else if (a === 'codeTree') { const n = byPath.get(codeState.file); if (n) { if (lay === 1) { pane = 'tree'; applyLayout(); } select(n, { expand: true, code: false }); } }
    else if (selected) {
      if (a === 'openAll') openSubtree(selected);
      else if (a === 'closeAll') closeSubtree(selected);
      else if (a === 'code') { revealCodePane(); showCodeFor(selected); }
    }
    return;
  }
  const li = t.closest('#qres li[data-i]'); if (li) { pickSearch(+li.dataset.i); return; }
  if (!t.closest('.search')) $('#qres').style.display = 'none';
  const dp = t.closest('[data-dproc]'); if (dp) { depProc = dp.dataset.dproc; depCell = null; renderDeps(); writeHash(); return; }
  const dm = t.closest('[data-dmode]'); if (dm) { depMode = dm.dataset.dmode; renderDeps(); writeHash(); return; }
  const td = t.closest('#mat td[data-r]'); if (td && +td.dataset.v) { depCell = [td.dataset.r, td.dataset.c]; renderDeps(); return; }
  const dk = t.closest('[data-dk]'); if (dk) { depProc = procOf(dk.dataset.dk); depCell = null; setView('deps'); return; }
  const k = t.closest('[data-k]'); if (k) { const n = nodes.get(k.dataset.k); if (n) { if (view !== 'tree') setView('tree'); select(n); } return; }
  const id = t.closest('[data-id]'); if (id) { const n = idIndex.get(id.dataset.id); if (n) { setView('tree'); select(n); } }
});
const tip = $('#tip');
document.addEventListener('mousemove', (e) => {
  const td = e.target.closest?.('#mat td[data-r]');
  if (!td) { tip.style.display = 'none'; return; }
  tip.innerHTML = `${esc(td.dataset.r)} → ${esc(td.dataset.c.replace('/*', ' 전체'))}<br><b>${td.dataset.v}</b>건 (파일→파일)${+td.dataset.v ? ' · 눌러서 목록 보기' : ''}`;
  tip.style.display = 'block';
  tip.style.left = Math.max(8, Math.min(innerWidth - 370, e.clientX + 14)) + 'px';
  tip.style.top = e.clientY + 14 + 'px';
});
let qTimer;
$('#q').addEventListener('input', (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => doSearch(e.target.value), 120); });
$('#q').addEventListener('keydown', (e) => {
  const lis = [...document.querySelectorAll('#qres li[data-i]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    qAct = Math.max(0, Math.min(lis.length - 1, qAct + (e.key === 'ArrowDown' ? 1 : -1)));
    lis.forEach((l, i) => l.classList.toggle('act', i === qAct));
    lis[qAct]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') pickSearch(qAct);
  else if (e.key === 'Escape') $('#qres').style.display = 'none';
});
$('#q').addEventListener('focus', () => { if ($('#q').value.trim()) $('#qres').style.display = 'block'; });
$('#crumbs').addEventListener('click', (e) => { const a = e.target.closest('a[data-k]'); if (a) { e.stopPropagation(); select(nodes.get(a.dataset.k), { expand: false }); } });
$('#themeBtn').addEventListener('click', () => {
  document.documentElement.dataset.theme = themeIsDark() ? 'light' : 'dark';
  renderLegend();
  if (view === 'tree') render(); else if (view === 'deps') renderDeps();
  if (selected) renderDetail(selected);
  writeHash();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { renderLegend(); if (view === 'tree') render(); });
// 창 크기가 바뀌면 배치(3·2·1단)와 트리 모양을 다시 정한다
let rsTimer;
// 창 크기가 바뀌면 배치(3·2·1단)와 트리 모양을 다시 정한다. window resize가 안 오는 환경(기기 에뮬레이션)도 있어 body 크기 감시로도 잡는다.
function onResize() {
  clearTimeout(rsTimer);
  rsTimer = setTimeout(() => {
    const nl = computeLay();
    if (nl !== lay) { if (lay === 1 && pane !== 'tree') side = pane; if (nl === 1 && lay === 2) pane = side; lay = nl; applyLayout(); if (codeVisible()) { if (codeState.file) openCode(codeState.file, codeState.from, codeState.to); else if (selected) showCodeFor(selected); } }
    if (view === 'tree') { render(); if (selected) scrollToNode(selected, true); }
  }, 100);
}
addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(document.body);
new ResizeObserver(onResize).observe($('#treeWrap'));

$('#metaLine').textContent = `${DATA.meta.files} 파일 · ${fmt(DATA.meta.totalLines)}줄`;
readHash();
})();
</script>
</body>
</html>
