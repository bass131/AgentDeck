<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDeck 현황판</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="strip">
  <div class="wrap">
    <span class="brand">AgentDeck 현황판</span>
    <div class="strip-status" id="strip-status"></div>
    <nav class="jump" aria-label="영역 바로 가기">
      <a href="#now" data-jump="1">지금</a><a href="#phases" data-jump="2">단계</a><a href="#hooks" data-jump="3">검사 기록</a><a href="#tree" data-jump="4">브랜치</a><a href="#ref" data-jump="5">원문</a>
    </nav>
    <div class="theme-switch" role="group" aria-label="화면 테마">
      <button type="button" data-theme-set="system" aria-pressed="false">시스템</button>
      <button type="button" data-theme-set="light" aria-pressed="false">라이트</button>
      <button type="button" data-theme-set="dark" aria-pressed="true">다크</button>
    </div>
  </div>
</header>
<div class="banner" id="banner" role="status" aria-live="polite"></div>

<main class="wrap" id="top">
  <section class="now" id="now" aria-label="지금 상황 요약"></section>
  <section class="decide" id="decide" aria-labelledby="decide-h" hidden>
    <header class="area-head"><h2 id="decide-h">결정이 필요한 일</h2><div class="area-sum" id="decide-sum"></div></header>
    <div id="decide-list"></div>
    <div class="send" id="decide-send" aria-live="polite"></div>
  </section>
  <div class="board">
    <div class="col col-main">
      <section class="area" id="phases" aria-labelledby="phases-h"></section>
      <section class="area" id="hooks" aria-labelledby="hooks-h"></section>
    </div>
    <div class="col col-side">
      <section class="area" id="tree" aria-labelledby="tree-h"></section>
    </div>
  </div>
  <section class="ref" id="ref" aria-labelledby="ref-h">
    <header class="ref-head">
      <h2 id="ref-h">원문과 참고</h2>
      <p>에이전트가 쓴 문서 그대로입니다. 필요할 때 펼쳐 보세요.</p>
      <button type="button" class="ghost" id="toggle-all" aria-pressed="false">모두 펼치기</button>
    </header>
    <div class="ref-grid">
      <section class="panel" id="pin"></section>
      <section class="panel" id="ledger"></section>
      <section class="panel" id="backlog"></section>
      <section class="panel" id="milestones"></section>
      <section class="panel" id="sources"></section>
    </div>
    <p class="keys" id="keys"></p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="bootstrap">__BOOTSTRAP_JSON__</script>
<script src="/chime.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
